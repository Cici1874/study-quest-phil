<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Quest — Supervised by Phil</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Instrument+Serif&family=DM+Sans:wght@400;500;600;700&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #F5EFE4;
  --bg-card: #FFFBF3;
  --bg-dark: #2C2438;
  --ink: #2C2438;
  --ink-light: #6B5E7B;
  --ink-faint: #A89BB5;
  --amber: #E8A830;
  --amber-glow: #F5C04A;
  --amber-dark: #C08820;
  --purple: #7B5EA7;
  --purple-light: #A78BCA;
  --purple-dark: #4A3566;
  --coral: #E07858;
  --teal: #4A9E8E;
  --blue: #5B82B8;
  --outline: #2C2438;
  --outline-w: 2px;
  --radius: 12px;
  --shadow: 3px 3px 0px #2C2438;
  --shadow-sm: 2px 2px 0px #2C2438;
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  /* Moebius crosshatch background pattern */
  background-image: 
    repeating-linear-gradient(45deg, transparent, transparent 18px, rgba(44,36,56,0.03) 18px, rgba(44,36,56,0.03) 19px),
    repeating-linear-gradient(-45deg, transparent, transparent 18px, rgba(44,36,56,0.03) 18px, rgba(44,36,56,0.03) 19px);
}

.app {
  max-width: 520px;
  margin: 0 auto;
  padding: 24px 16px 40px;
}

/* ── Header ── */
.header {
  text-align: center;
  margin-bottom: 24px;
  position: relative;
}

.header-badge {
  display: inline-block;
  background: var(--bg-dark);
  color: var(--amber);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
  padding: 5px 16px;
  border-radius: 20px;
  border: var(--outline-w) solid var(--outline);
  margin-bottom: 10px;
}

.header h1 {
  font-family: 'Instrument Serif', serif;
  font-size: 42px;
  font-weight: 400;
  color: var(--ink);
  line-height: 1.1;
  margin-bottom: 4px;
}

.header h1 span {
  color: var(--amber);
}

.header-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  color: var(--ink-light);
}

/* ── Phil Speech Bubble ── */
.phil-bubble {
  background: var(--bg-card);
  border: var(--outline-w) solid var(--outline);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px 18px;
  margin-bottom: 18px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  position: relative;
}

.phil-avatar {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: var(--outline-w) solid var(--outline);
  background: linear-gradient(135deg, var(--amber) 0%, #E8923A 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  flex-shrink: 0;
  box-shadow: var(--shadow-sm);
  position: relative;
}

.phil-text {
  flex: 1;
  font-size: 15px;
  color: var(--ink);
  line-height: 1.55;
  font-style: italic;
}

.phil-sig {
  font-size: 12px;
  color: var(--ink-faint);
  font-style: normal;
  margin-top: 6px;
  font-family: 'JetBrains Mono', monospace;
}

/* ── Token Bank ── */
.token-bank {
  background: var(--bg-dark);
  border: var(--outline-w) solid var(--outline);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px 20px;
  margin-bottom: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.token-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--purple-light);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 4px;
}

.token-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 64px;
  font-weight: 800;
  color: var(--amber);
  line-height: 1;
  text-shadow: 0 0 20px rgba(232,168,48,0.3);
}

.token-meta {
  text-align: right;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--purple-light);
}

/* ── Stats Row ── */
.stats-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
}

.stat-card {
  background: var(--bg-card);
  border: var(--outline-w) solid var(--outline);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 12px;
  text-align: center;
}

.stat-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--ink-faint);
  letter-spacing: 2px;
  margin-bottom: 4px;
}

.stat-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 36px;
  font-weight: 800;
  color: var(--ink);
}

.stat-icon {
  font-size: 30px;
  margin-left: 4px;
  vertical-align: middle;
}

/* ── Combo Meter ── */
.combo-meter {
  background: var(--bg-card);
  border: var(--outline-w) solid var(--outline);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 12px 16px;
  margin-bottom: 18px;
}

.combo-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.combo-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  color: var(--ink-light);
  letter-spacing: 1px;
}

.combo-bonus {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--amber-dark);
  font-weight: 700;
}

.combo-bar {
  display: flex;
  gap: 6px;
}

.combo-pip {
  flex: 1;
  height: 10px;
  border-radius: 5px;
  border: 1.5px solid var(--outline);
  background: var(--bg);
  transition: background 0.3s, box-shadow 0.3s;
}

.combo-pip.filled {
  background: var(--amber);
  box-shadow: 0 0 8px rgba(232,168,48,0.4);
}

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: 0;
  margin-bottom: 18px;
  background: var(--bg-card);
  border: var(--outline-w) solid var(--outline);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

.tab-btn {
  flex: 1;
  padding: 16px 0;
  background: transparent;
  border: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 17px;
  font-weight: 700;
  color: var(--ink-faint);
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}

.tab-btn.active {
  background: var(--ink);
  color: var(--amber);
}

.tab-btn:not(.active):hover {
  background: rgba(44,36,56,0.05);
}

/* ── Subject Picker ── */
.section-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.section-label span {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  color: var(--ink-faint);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.edit-btn {
  background: none;
  border: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ink-faint);
  cursor: pointer;
}

.edit-btn:hover { color: var(--ink); }

.subjects {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 20px;
}

.subject-btn {
  padding: 14px 14px;
  background: var(--bg-card);
  border: var(--outline-w) solid var(--outline);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  text-align: left;
  transition: all 0.15s;
}

.subject-btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0px var(--outline); }
.subject-btn.selected { background: var(--purple); color: white; box-shadow: var(--shadow); transform: translate(-1px, -1px); }
.subject-btn.selected .subject-name { color: white; }
.subject-btn.selected .subject-count { color: rgba(255,255,255,0.6); }

.subject-emoji { font-size: 24px; margin-bottom: 6px; display: block; }
.subject-name { font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 600; color: var(--ink); display: block; }
.subject-count { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-faint); margin-top: 4px; display: block; }

.subject-edit-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: var(--bg-card);
  border: var(--outline-w) solid var(--outline);
  border-radius: var(--radius);
  margin-bottom: 8px;
}

.subject-edit-row input {
  flex: 1;
  background: var(--bg);
  border: 1.5px solid var(--ink-faint);
  border-radius: 6px;
  padding: 6px 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  color: var(--ink);
  outline: none;
}

.subject-edit-row input:focus { border-color: var(--purple); }

/* ── Timer ── */
.timer-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 0;
}

.timer-ring-container {
  position: relative;
  width: 220px;
  height: 220px;
  margin-bottom: 24px;
}

.timer-ring-container svg {
  transform: rotate(-90deg);
}

.timer-ring-bg {
  fill: none;
  stroke: var(--bg);
  stroke-width: 8;
}

.timer-ring-progress {
  fill: none;
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 1s linear, stroke 0.3s;
}

.timer-display {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.timer-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 58px;
  font-weight: 800;
  color: var(--ink);
  letter-spacing: 2px;
}

.timer-time.complete { color: var(--teal); }
.timer-time.running { color: var(--purple); }

.timer-subject-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--ink-light);
  margin-top: 4px;
}

.timer-controls {
  display: flex;
  gap: 10px;
}

.btn {
  padding: 18px 44px;
  border: var(--outline-w) solid var(--outline);
  border-radius: var(--radius);
  font-family: 'JetBrains Mono', monospace;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: all 0.15s;
}

.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0px var(--outline); }
.btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0px var(--outline); }

.btn-primary {
  background: var(--amber);
  color: var(--ink);
}

.btn-success {
  background: var(--teal);
  color: white;
}

.btn-ghost {
  background: var(--bg-card);
  color: var(--ink-light);
  padding: 14px 20px;
}

.btn-disabled {
  background: var(--bg);
  color: var(--ink-faint);
  cursor: not-allowed;
  box-shadow: var(--shadow-sm);
}

.btn-disabled:hover { transform: none; box-shadow: var(--shadow-sm); }

/* ── Redeem Shop ── */
.shop {
  background: var(--bg-card);
  border: var(--outline-w) solid var(--outline);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
}

.shop-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--ink-faint);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 14px;
}

.shop-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  border: 1.5px solid var(--bg);
  border-radius: 10px;
  margin-bottom: 8px;
  transition: all 0.15s;
}

.shop-item.affordable {
  border-color: var(--outline);
  background: white;
}

.shop-item.affordable:hover {
  background: #FEFAED;
}

.shop-item-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.shop-item-icon {
  font-size: 26px;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  border-radius: 8px;
  border: 1.5px solid var(--outline);
}

.shop-item-name {
  font-family: 'JetBrains Mono', monospace;
  font-size: 17px;
  font-weight: 600;
  color: var(--ink);
}

.shop-item-desc {
  font-size: 14px;
  color: var(--ink-light);
  margin-top: 2px;
}

.shop-buy-btn {
  padding: 8px 16px;
  border: 1.5px solid var(--outline);
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  background: var(--amber);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
  transition: all 0.15s;
}

.shop-buy-btn:hover { transform: translate(-1px, -1px); }
.shop-buy-btn.disabled { background: var(--bg); color: var(--ink-faint); cursor: not-allowed; box-shadow: none; }
.shop-buy-btn.disabled:hover { transform: none; }

.redeemed-section {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1.5px dashed var(--ink-faint);
}

.redeemed-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--ink-faint);
  letter-spacing: 2px;
  margin-bottom: 6px;
}

.redeemed-item {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--ink-light);
  margin-bottom: 3px;
}


/* ── Settings Panel ── */
.settings-toggle {
  position: fixed;
  top: 12px;
  right: 12px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--bg-card);
  border: var(--outline-w) solid var(--outline);
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  cursor: pointer;
  z-index: 100;
  transition: transform 0.2s;
}
.settings-toggle:hover { transform: rotate(30deg); }

.settings-overlay {
  position: fixed;
  inset: 0;
  background: rgba(44,36,56,0.5);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.settings-panel {
  background: var(--bg-card);
  border: var(--outline-w) solid var(--outline);
  border-radius: var(--radius) var(--radius) 0 0;
  box-shadow: 0 -8px 30px rgba(44,36,56,0.3);
  width: 100%;
  max-width: 520px;
  max-height: 80vh;
  overflow-y: auto;
  padding: 24px 20px 32px;
}

.settings-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--ink-faint);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.settings-close {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: var(--ink-faint);
}
.settings-close:hover { color: var(--ink); }

.settings-group {
  margin-bottom: 18px;
}

.settings-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 1px;
  margin-bottom: 8px;
  text-transform: uppercase;
}

.settings-options {
  display: flex;
  gap: 8px;
}

.settings-opt {
  flex: 1;
  padding: 10px 0;
  background: var(--bg);
  border: 1.5px solid var(--ink-faint);
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 700;
  color: var(--ink-light);
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
}

.settings-opt.active {
  background: var(--purple);
  border-color: var(--purple);
  color: white;
}

.settings-opt:hover:not(.active) {
  border-color: var(--ink);
}

/* ── Shop Edit ── */
.shop-edit-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
  padding: 8px 10px;
  background: var(--bg);
  border-radius: 8px;
  border: 1.5px solid transparent;
}

.shop-edit-row:focus-within {
  border-color: var(--purple);
}

.shop-edit-icon {
  font-size: 18px;
  width: 32px;
  text-align: center;
  cursor: pointer;
}

.shop-edit-input {
  flex: 1;
  background: none;
  border: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ink);
  outline: none;
  min-width: 0;
}

.shop-edit-cost {
  width: 36px;
  background: none;
  border: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  color: var(--amber-dark);
  text-align: center;
  outline: none;
}


/* ── Update Log ── */
.update-overlay {
  position: fixed;
  inset: 0;
  background: rgba(44,36,56,0.6);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.update-card {
  background: var(--bg-card);
  border: var(--outline-w) solid var(--outline);
  border-radius: var(--radius);
  box-shadow: 0 8px 40px rgba(44,36,56,0.4);
  max-width: 440px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  padding: 28px 24px;
}

.update-badge {
  display: inline-block;
  background: var(--amber);
  color: var(--ink);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  padding: 4px 12px;
  border-radius: 6px;
  margin-bottom: 14px;
}

.update-title {
  font-family: 'Instrument Serif', serif;
  font-size: 26px;
  color: var(--ink);
  margin-bottom: 6px;
}

.update-phil {
  font-size: 14px;
  color: var(--ink-light);
  font-style: italic;
  margin-bottom: 18px;
  line-height: 1.5;
}

.update-section {
  margin-bottom: 14px;
}

.update-section-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--purple);
  letter-spacing: 1px;
  margin-bottom: 6px;
  font-weight: 700;
}

.update-item {
  font-size: 14px;
  color: var(--ink);
  line-height: 1.6;
  padding-left: 16px;
  position: relative;
  margin-bottom: 4px;
}

.update-item::before {
  content: '·';
  position: absolute;
  left: 4px;
  color: var(--amber);
  font-weight: 700;
}

.update-close {
  display: block;
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  background: var(--bg-dark);
  color: var(--amber);
  border: var(--outline-w) solid var(--outline);
  border-radius: var(--radius);
  font-family: 'JetBrains Mono', monospace;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: all 0.15s;
}

.update-close:hover {
  transform: translate(-1px, -1px);
  box-shadow: 4px 4px 0px var(--outline);
}

/* ── Footer ── */
.footer {
  text-align: center;
  margin-top: 28px;
  padding-top: 16px;
  border-top: 1.5px dashed var(--ink-faint);
}

.footer-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ink-faint);
}

.reset-btn {
  margin-top: 8px;
  background: none;
  border: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-faint);
  cursor: pointer;
  opacity: 0.5;
}

.reset-btn:hover { opacity: 1; }

/* ── Notification Toast ── */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  background: var(--bg-dark);
  color: var(--amber);
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  font-weight: 700;
  padding: 16px 30px;
  border-radius: var(--radius);
  border: var(--outline-w) solid var(--outline);
  box-shadow: 0 8px 30px rgba(44,36,56,0.3);
  z-index: 1000;
  transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  white-space: nowrap;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
}

/* ── Animations ── */
@keyframes pulse-glow {
  0%, 100% { box-shadow: var(--shadow), 0 0 0px var(--amber); }
  50% { box-shadow: var(--shadow), 0 0 16px var(--amber); }
}

.claiming { animation: pulse-glow 1s ease-in-out 3; }

/* ── Phil Image Avatar ── */
.phil-img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}

.phil-face {
  position: absolute;
  bottom: -4px;
  right: -4px;
  font-size: 22px;
  background: var(--bg-card);
  border-radius: 50%;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1.5px solid var(--outline);
  box-shadow: var(--shadow-sm);
}

/* ── Art Gallery ── */
.gallery-section {
  background: var(--bg-card);
  border: var(--outline-w) solid var(--outline);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  margin-bottom: 20px;
}

.gallery-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--ink-faint);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 14px;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
}

.gallery-thumb {
  aspect-ratio: 1;
  border-radius: 10px;
  overflow: hidden;
  border: 1.5px solid var(--outline);
  box-shadow: var(--shadow-sm);
  transition: transform 0.2s, box-shadow 0.2s;
  animation: thumb-in 0.4s ease both;
}

@keyframes thumb-in {
  0% { transform: scale(0.8); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.gallery-thumb:hover {
  transform: scale(1.08) translateY(-2px);
  box-shadow: 4px 4px 0px var(--outline);
  z-index: 2;
  position: relative;
}

.gallery-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.gallery-note {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--ink-faint);
  font-style: italic;
  margin-top: 12px;
  text-align: right;
}

/* Locked gallery items */
.gallery-thumb.locked img {
  filter: blur(8px) grayscale(0.5);
  transform: scale(1.1);
}

.gallery-thumb.locked {
  position: relative;
  overflow: hidden;
  cursor: default;
}

.gallery-thumb.locked:hover {
  transform: none;
  box-shadow: var(--shadow-sm);
}

.lock-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(44,36,56,0.25);
  font-size: 18px;
}

.lock-at {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--ink-light);
  margin-top: 2px;
}

.gallery-thumb.unlocked {
  animation: thumb-in 0.4s ease both;
}

/* Art unlock overlay card */
.art-unlock-card {
  background: var(--bg-card);
  border: 3px solid var(--outline);
  border-radius: 20px;
  box-shadow: 6px 6px 0px var(--outline);
  padding: 28px 24px;
  text-align: center;
  animation: card-reveal 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  max-width: 300px;
  width: 90%;
}

.art-unlock-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 2px;
  margin-bottom: 14px;
}

.art-unlock-img-wrap {
  width: 180px;
  height: 180px;
  margin: 0 auto 16px;
  border-radius: 14px;
  overflow: hidden;
  border: 2px solid var(--outline);
  box-shadow: var(--shadow);
}

.art-unlock-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  animation: art-zoom-in 0.8s ease;
}

@keyframes art-zoom-in {
  0% { transform: scale(1.5); filter: blur(10px); }
  100% { transform: scale(1); filter: blur(0); }
}

.art-unlock-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  font-weight: 800;
  color: var(--amber);
  margin-bottom: 10px;
}

.art-unlock-phil {
  font-size: 14px;
  color: var(--ink-light);
  font-style: italic;
  line-height: 1.5;
  margin-bottom: 18px;
}

/* Overlay reuse */
.redeem-overlay {
  position: fixed;
  inset: 0;
  background: rgba(44,36,56,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 998;
  animation: overlay-in 0.3s ease;
}

@keyframes overlay-in {
  0% { opacity: 0; }
  100% { opacity: 1; }
}

@keyframes card-reveal {
  0% { transform: scale(0.3) rotateY(90deg); opacity: 0; }
  60% { transform: scale(1.05) rotateY(-5deg); }
  100% { transform: scale(1) rotateY(0deg); opacity: 1; }
}

.redeem-close {
  padding: 10px 28px;
  background: var(--amber);
  border: 2px solid var(--outline);
  border-radius: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
}

</style>
</head>

function nagPick(pool) {
  return pool[Math.floor(Math.random() * pool.length)];
}

// Check how many hours since last study
function getHoursSinceLastStudy() {
  if (!data.lastStudyDate) return 999;
  const last = new Date(data.lastStudyDate + 'T23:59:00');
  const now = new Date();
  return (now - last) / (1000 * 60 * 60);
}

// Determine Phil's opening mood on app load
function getOpeningPhilState() {
  const hours = getHoursSinceLastStudy();
  const prevStreak = loadSetting('prevStreak') || 0;
  
  // Streak broken detection
  if (prevStreak >= 3 && data.streak === 0) {
    const msg = nagPick(PHIL_NAG.streak_broken).replace(/\{n\}/g, prevStreak);
    saveSetting('prevStreak', 0);
    return { mood: 'broke', text: msg };
  }
  
  // Save current streak for future break detection
  if (data.streak > 0) saveSetting('prevStreak', data.streak);
  
  // Streak encouragement (check milestones)
  if (data.streak >= 3) {
    // Find the highest matching encouragement tier
    let bestTier = null;
    for (const tier of PHIL_ENCOURAGE) {
      if (data.streak >= tier.at) bestTier = tier;
    }
    if (bestTier && data.streak === bestTier.at) {
      return { mood: 'streak', text: nagPick(bestTier.quotes) };
    }
  }
  
  // Token hoarding
  if (data.tokens >= 8) {
    const lastRedeem = loadSetting('lastRedeemDate');
    const daysSinceRedeem = lastRedeem ? 
      Math.floor((new Date() - new Date(lastRedeem)) / (1000*60*60*24)) : 999;
    if (daysSinceRedeem >= 3) {
      return { mood: 'idle', text: data.tokens + '个token了。' + nagPick(PHIL_NAG.hoarding_tokens) };
    }
  }
  
  // Absence tiers
  if (hours >= 72) return { mood: 'broke', text: nagPick(PHIL_NAG.absent_72h) };
  if (hours >= 48) return { mood: 'broke', text: nagPick(PHIL_NAG.absent_48h) };
  if (hours >= 24) return { mood: 'idle', text: nagPick(PHIL_NAG.absent_24h) };
  
  // Default
  return null;
}

// Idle staring detection
let idleStareTimer = null;
function startIdleStareDetection() {
  if (idleStareTimer) clearTimeout(idleStareTimer);
  idleStareTimer = setTimeout(() => {
    if (!timerRunning && !timerComplete && activeTab === 'timer') {
      philMood = 'idle';
      philText = nagPick(PHIL_NAG.idle_staring);
      render();
    }
  }, 60000); // 60 seconds
}

// Pause detection
let pauseNagTimer = null;
function startPauseDetection() {
  if (pauseNagTimer) clearTimeout(pauseNagTimer);
  pauseNagTimer = setTimeout(() => {
    if (!timerRunning && !timerComplete && timerSeconds < TIMER_DURATION && timerSeconds > 0) {
      philText = nagPick(PHIL_NAG.paused_long);
      render();
    }
  }, 300000); // 5 minutes
}


function philSays(mood) {
  const pool = PHIL[mood] || PHIL.idle;
  return pool[Math.floor(Math.random() * pool.length)];
}

function getToday() { return new Date().toISOString().split('T')[0]; }

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d.todayDate !== getToday()) {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        const yStr = yesterday.toISOString().split('T')[0];
        if (d.lastStudyDate !== yStr && d.lastStudyDate !== d.todayDate) d.streak = 0;
        d.todayPomodoros = 0;
        d.todayDate = getToday();
      }
      // Backfill missing fields from older versions
      if (!d.subjects) d.subjects = DEFAULT_SUBJECTS;
      if (d.unlockedArt === undefined) d.unlockedArt = 0;
      if (!d.promptsUnlocked) d.promptsUnlocked = [];
      return d;
    }
  } catch(e) {}
  return {
    tokens: 0, totalPomodoros: 0, todayPomodoros: 0,
    todayDate: getToday(), streak: 0, lastStudyDate: null,
    subjectPomodoros: {}, tokensSpent: 0, promptsUnlocked: [],
    subjects: DEFAULT_SUBJECTS, unlockedArt: 0,
  };
}

function saveData(d) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch(e) {}
}

let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {

  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

    audio.play();

// ── Settings Panel ──
let settingsOpen = false;

function openSettings() {
  settingsOpen = true;
  const overlay = document.createElement('div');
  overlay.id = 'settingsOverlay';
  overlay.className = 'settings-overlay';
  overlay.onclick = function(e) { if (e.target === overlay) closeSettings(); };
  
  const timerMins = TIMER_DURATION / 60;
  const shopHtml = SHOP_ITEMS.map((item, i) => `
    <div class="shop-edit-row">
      <span class="shop-edit-icon" onclick="cycleShopIcon(${i})">${item.icon}</span>
      <input class="shop-edit-input" value="${item.label}" placeholder="Name" onchange="updateShopItem(${i}, 'label', this.value)" />
      <input class="shop-edit-input" value="${item.desc}" placeholder="Description" style="color:var(--ink-light)" onchange="updateShopItem(${i}, 'desc', this.value)" />
      <input class="shop-edit-cost" type="number" min="1" max="99" value="${item.cost}" onchange="updateShopItem(${i}, 'cost', parseInt(this.value)||1)" />🪙
    </div>
  `).join('');
  
  overlay.innerHTML = `
    <div class="settings-panel">
      <div class="settings-title">
        <span>⚙ SETTINGS</span>
        <button class="settings-close" onclick="closeSettings()">✕</button>
      </div>
      
      <div class="settings-group">
        <div class="settings-label">Timer Duration</div>
        <div class="settings-options">
          <button class="settings-opt ${timerMins===25?'active':''}" onclick="setTimer(25)">25 min</button>
          <button class="settings-opt ${timerMins===40?'active':''}" onclick="setTimer(40)">40 min</button>
          <button class="settings-opt ${timerMins===50?'active':''}" onclick="setTimer(50)">50 min</button>
        </div>
      </div>
      
      <div class="settings-group">
        <div class="settings-label">Combo Threshold (bonus every N 🐾)</div>
        <div class="settings-options">
          <button class="settings-opt ${COMBO_THRESHOLD===3?'active':''}" onclick="setCombo(3)">3</button>
          <button class="settings-opt ${COMBO_THRESHOLD===4?'active':''}" onclick="setCombo(4)">4</button>
          <button class="settings-opt ${COMBO_THRESHOLD===5?'active':''}" onclick="setCombo(5)">5</button>
        </div>
      </div>
      
      <div class="settings-group">
        <div class="settings-label">Rewards Shop (tap icon to change)</div>
        ${shopHtml}
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

function closeSettings() {
  settingsOpen = false;
  const el = document.getElementById('settingsOverlay');
  if (el) el.remove();
  render();
}

function setTimer(mins) {
  if (timerRunning) return; // don't change mid-session
  saveSetting('timerMinutes', mins);
  TIMER_DURATION = mins * 60;
  timerSeconds = TIMER_DURATION;
  closeSettings();
}

function setCombo(n) {
  saveSetting('comboThreshold', n);
  COMBO_THRESHOLD = n;
  closeSettings();
}

const SHOP_ICONS = ['📱','🍪','🎮','🌟','☕','🍰','🎵','📺','🛍️','🎨','🏃','🧘','📖','🎯','🔄','✨'];

function cycleShopIcon(idx) {
  const curr = SHOP_ITEMS[idx].icon;
  const ci = SHOP_ICONS.indexOf(curr);
  SHOP_ITEMS[idx].icon = SHOP_ICONS[(ci + 1) % SHOP_ICONS.length];
  saveShopItems(SHOP_ITEMS);
  // Re-render settings panel
  closeSettings();
  openSettings();
}

function updateShopItem(idx, field, value) {
  SHOP_ITEMS[idx][field] = value;
  saveShopItems(SHOP_ITEMS);
}

// ── Render ──
function render() {
  const app = document.getElementById('app');
  const progress = 1 - timerSeconds / TIMER_DURATION;
  const circumference = 2 * Math.PI * 92;
  const comboProgress = data.todayPomodoros % COMBO_THRESHOLD;
  const comboEarned = Math.floor(data.todayPomodoros / COMBO_THRESHOLD);
  
  const philFace = { idle: '😑', running: '😴', earned: '😏', broke: '🙄', streak: '👀', combo: '😏' }[philMood] || '😑';

  let timerStroke = 'var(--bg)';
  let timeClass = '';
  if (timerComplete) { timerStroke = 'var(--teal)'; timeClass = 'complete'; }
  else if (timerRunning) { timerStroke = 'var(--purple)'; timeClass = 'running'; }

  const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
  const secs = (timerSeconds % 60).toString().padStart(2, '0');

  app.innerHTML = `
    <!-- Settings Gear -->
    <button class="settings-toggle" onclick="openSettings()">⚙</button>

    <!-- Header -->
    <div class="header">
      <div class="header-badge">STUDY MODE</div>
      <h1>Study <span>Quest</span></h1>
      <div class="header-sub">${TIMER_DURATION/60}min study = 1 token · supervised by Phil</div>
    </div>

    <!-- Phil -->
    <div class="phil-bubble">
      <div class="phil-avatar"><img src="${PHIL_AVATAR}" alt="Phil" class="phil-img" /><span class="phil-face">${philFace}</span></div>
      <div>
        <div class="phil-text">"${philText}"</div>
        <div class="phil-sig">— Phil, Chief Motivation Officer (self-appointed)</div>
      </div>
    </div>

    <!-- Token Bank -->
    <div class="token-bank">
      <div>
        <div class="token-label">Tokens</div>
        <div class="token-count">${data.tokens}</div>
      </div>
      <div class="token-meta">
        <div>earn tokens, spend on rewards</div>
        <div style="margin-top:2px; opacity:0.6">spent: ${data.tokensSpent}</div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">TODAY</div>
        <div class="stat-value">${data.todayPomodoros}<span class="stat-icon">🐾</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">TOTAL</div>
        <div class="stat-value">${data.totalPomodoros}<span class="stat-icon">🐾</span></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">STREAK</div>
        <div class="stat-value">${data.streak}<span class="stat-icon">🐟</span></div>
      </div>
    </div>

    <!-- Combo -->
    <div class="combo-meter">
      <div class="combo-header">
        <span class="combo-label">COMBO — 每${COMBO_THRESHOLD}个🐾 额外+1 token</span>
        <span class="combo-bonus">${comboEarned > 0 ? '+' + comboEarned + ' bonus today' : ''}</span>
      </div>
      <div class="combo-bar">
        ${Array.from({length: COMBO_THRESHOLD}).map((_, i) => 
          `<div class="combo-pip ${i < comboProgress ? 'filled' : ''}"></div>`
        ).join('')}
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn ${activeTab === 'timer' ? 'active' : ''}" onclick="switchTab('timer')">⏱ STUDY</button>
      <button class="tab-btn ${activeTab === 'shop' ? 'active' : ''}" onclick="switchTab('shop')">⭐ REDEEM</button>
    </div>

    ${activeTab === 'timer' ? renderTimer(mins, secs, timeClass, timerStroke, circumference, progress) : renderShop()}


    <!-- Art Gallery -->
    ${renderGallery()}

    <!-- Footer -->
    <div class="footer">
      <div class="footer-text">Phil Standard Time™ · No refunds on motivation</div>
      <button class="reset-btn" onclick="resetAll()">reset progress</button>
    </div>
  `;
}

function renderGallery() {
  const ua = data.unlockedArt || 0;
  let thumbs = '';
  for (let i = 0; i < GALLERY.length; i++) {
    const unlocked = i < ua;
    const ms = MILESTONES[i];
    const atNum = ms ? ms.at : '?';
    if (unlocked) {
      thumbs += '<div class="gallery-thumb unlocked"><img src="' + GALLERY[i] + '" alt="art ' + (i+1) + '" loading="lazy" /></div>';
    } else {
      thumbs += '<div class="gallery-thumb locked" title="Unlock at ' + atNum + ' total pomodoros"><img src="' + GALLERY[i] + '" alt="art ' + (i+1) + '" loading="lazy" /><div class="lock-overlay">🔒<span class="lock-at">' + atNum + '</span></div></div>';
    }
  }
  const nextAt = (ua < MILESTONES.length) ? MILESTONES[ua].at : null;
  const note = ua >= GALLERY.length ? 'all unlocked. you did this. — Phil' : 'next unlock at ' + nextAt + ' total pomodoros';
  return '<div class="gallery-section"><div class="gallery-label">PHIL\'S COLLECTION <span style="float:right;color:var(--amber)">' + ua + '/' + GALLERY.length + '</span></div><div class="gallery-grid">' + thumbs + '</div><div class="gallery-note">' + note + '</div></div>';
}

function renderTimer(mins, secs, timeClass, timerStroke, circumference, progress) {
  return `
    <!-- Subject Picker -->
    <div class="section-label">
      <span>SELECT SUBJECT</span>
      <button class="edit-btn" onclick="toggleEdit()">${editing ? '✓ DONE' : '✎ EDIT'}</button>
    </div>

    ${editing ? data.subjects.map(s => `
      <div class="subject-edit-row">
        <span style="font-size:20px">${s.emoji}</span>
        <input type="text" value="${s.name}" onchange="editSubject('${s.id}', this.value)" />
      </div>
    `).join('') : `
      <div class="subjects">
        ${data.subjects.map(s => `
          <button class="subject-btn ${selectedSubject?.id === s.id ? 'selected' : ''}" onclick="selectSubject('${s.id}')">
            <span class="subject-emoji">${s.emoji}</span>
            <span class="subject-name">${s.name}</span>
            <span class="subject-count">${data.subjectPomodoros[s.id] || 0} pomodoros</span>
          </button>
        `).join('')}
      </div>
    `}

    <!-- Timer -->
    <div class="timer-area">
      <div class="timer-ring-container">
        <svg width="220" height="220" viewBox="0 0 220 220">
          <circle class="timer-ring-bg" cx="110" cy="110" r="92" stroke-width="8"/>
          <circle class="timer-ring-progress" cx="110" cy="110" r="92"
            stroke="${timerStroke}"
            stroke-dasharray="${circumference}"
            stroke-dashoffset="${circumference * (1 - progress)}"
          />
        </svg>
        <div class="timer-display">
          <div class="timer-time ${timeClass}">${timerComplete ? 'DONE' : mins + ':' + secs}</div>
          ${timerRunning ? `<div class="timer-subject-label">${selectedSubject?.name || ''}</div>` : ''}
        </div>
      </div>

      <div class="timer-controls">
        ${timerComplete ? `
          <button class="btn btn-success claiming" onclick="claimToken()">⭐ CLAIM TOKEN</button>
        ` : timerRunning ? `
          <button class="btn btn-ghost" onclick="pauseTimer()">⏸ PAUSE</button>
        ` : `
          <button class="btn ${selectedSubject ? 'btn-primary' : 'btn-disabled'}" onclick="startTimer()" ${!selectedSubject ? 'disabled' : ''}>▶ START</button>
          ${timerSeconds < TIMER_DURATION ? `<button class="btn btn-ghost" onclick="resetTimer()">↺</button>` : ''}
        `}
      </div>
    </div>
  `;
}

function renderShop() {
  return `
    <div class="shop">
      <div class="shop-title">Spend Tokens</div>
      ${SHOP_ITEMS.map(item => {
        const can = data.tokens >= item.cost;
        return `
          <div class="shop-item ${can ? 'affordable' : ''}">
            <div class="shop-item-left">
              <div class="shop-item-icon">${item.icon}</div>
              <div>
                <div class="shop-item-name">${item.label}</div>
                <div class="shop-item-desc">${item.desc}</div>
              </div>
            </div>
            <button class="shop-buy-btn ${can ? '' : 'disabled'}" onclick="${can ? `spendTokens(${item.cost}, '${item.label}')` : ''}" ${!can ? 'disabled' : ''}>${item.cost} 🪙</button>
          </div>
        `;
      }).join('')}
      ${data.promptsUnlocked.length > 0 ? `
        <div class="redeemed-section">
          <div class="redeemed-label">REDEEMED</div>
          ${data.promptsUnlocked.slice(-8).map(p => `<div class="redeemed-item">✓ ${p}</div>`).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

// ── Actions ──
function switchTab(t) { activeTab = t; render(); startIdleStareDetection(); }

function selectSubject(id) {
  if (timerRunning) return;
  selectedSubject = data.subjects.find(s => s.id === id) || null;
  render();
}

function toggleEdit() {
  editing = !editing;
  if (!editing) saveData(data);
  render();
}

function editSubject(id, name) {
  const s = data.subjects.find(s => s.id === id);
  if (s) { s.name = name; saveData(data); }
}

function startTimer() {
  if (!selectedSubject || timerRunning) return;
  if (idleStareTimer) clearTimeout(idleStareTimer);
  if (pauseNagTimer) clearTimeout(pauseNagTimer);
  ensureAudio(); // Activate AudioContext on user gesture
  timerRunning = true;
  fiveMinTriggered = false;
  philMood = 'running';
  philText = philSays('running');
  render();
  timerInterval = setInterval(() => {
    timerSeconds--;
    // 5 minutes remaining alert (at 35 min mark)
    if (timerSeconds === 300 && !fiveMinTriggered) {
      fiveMinTriggered = true;
      playCatMeow();
      showToast('🐱 Phil: 还剩5分钟，冲！');
      philMood = 'idle';
      philText = '最后5分钟了。冲一下。（我不常催人。珍惜。）';
      if (Notification.permission === 'granted') {
        try { new Notification('🐱 Phil says:', { body: '还剩5分钟。别现在放弃，那才是真的可笑。' }); } catch(e) {}
      }
    }
    if (timerSeconds <= 0) {
      timerSeconds = 0;
      timerRunning = false;
      timerComplete = true;
      clearInterval(timerInterval);
      timerInterval = null;
      showToast('🐾 ' + Math.round(TIMER_DURATION/60) + 'min done! Claim your token');
      // Try notification
      if (Notification.permission === 'granted') {
        try { new Notification('Study Quest', { body: Math.round(TIMER_DURATION/60) + ' minutes done! Claim your token ⭐' }); } catch(e) {}
      }
    }
    // Lightweight update: only change timer digits + ring, don't rebuild entire DOM
    updateTimerDisplay();
  }, 1000);
}

function updateTimerDisplay() {
  const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
  const secs = (timerSeconds % 60).toString().padStart(2, '0');
  const progress = 1 - timerSeconds / TIMER_DURATION;
  const circumference = 2 * Math.PI * 92;
  const isUrgent = timerRunning && timerSeconds <= 300 && timerSeconds > 0;

  const timeEl = document.querySelector('.timer-time');
  if (timeEl) {
    if (timerComplete) {
      timeEl.textContent = 'DONE';
      timeEl.className = 'timer-time complete';
    } else {
      timeEl.textContent = mins + ':' + secs;
      timeEl.className = 'timer-time' + (isUrgent ? ' urgent-text' : ' running');
    }
  }

  const ringEl = document.querySelector('.timer-ring-progress');
  if (ringEl) {
    ringEl.style.strokeDashoffset = circumference * (1 - progress);
    if (isUrgent) {
      ringEl.style.stroke = 'var(--coral)';
      ringEl.classList.add('urgent');
    } else if (timerComplete) {
      ringEl.style.stroke = 'var(--teal)';
      ringEl.classList.remove('urgent');
    }
  }

  // If timer just completed, do a full render for the CLAIM button
  if (timerComplete) render();
}

function pauseTimer() {
  timerRunning = false;
  clearInterval(timerInterval);
  timerInterval = null;
  philMood = 'idle';
  philText = '…暂停了。行吧。不是我能说什么。';
  startPauseDetection();
  render();
}

function resetTimer() {
  timerRunning = false;
  timerComplete = false;
  timerSeconds = TIMER_DURATION;
  fiveMinTriggered = false;
  clearInterval(timerInterval);
  timerInterval = null;
  render();
}

function claimToken() {
  const bonusBefore = Math.floor(data.todayPomodoros / COMBO_THRESHOLD);
  const bonusAfter = Math.floor((data.todayPomodoros + 1) / COMBO_THRESHOLD);
  const bonus = bonusAfter > bonusBefore ? 1 : 0;
  const total = 1 + bonus;

  data.tokens += total;
  data.totalPomodoros++;
  data.todayPomodoros++;
  if (data.lastStudyDate !== getToday()) data.streak++;
  data.lastStudyDate = getToday();
  data.subjectPomodoros[selectedSubject.id] = (data.subjectPomodoros[selectedSubject.id] || 0) + 1;
  
  // Check art milestone unlock
  const currentUnlocked = data.unlockedArt || 0;
  if (currentUnlocked < MILESTONES.length) {
    const nextMs = MILESTONES[currentUnlocked];
    if (data.totalPomodoros >= nextMs.at) {
      data.unlockedArt = currentUnlocked + 1;
      // Show unlock overlay after a short delay
      setTimeout(() => {
        artUnlockOverlay = { index: currentUnlocked, phil: nextMs.phil };
        showArtUnlock();
      }, 1500);
    }
  }
  
  saveData(data);

  timerComplete = false;
  timerSeconds = TIMER_DURATION;
  fiveMinTriggered = false;

  if (bonus) {
    philMood = 'combo';
    philText = philSays('combo');
    showToast(`+${total} tokens! (含combo bonus)`);
  } else if (data.todayPomodoros >= 6) {
    philMood = 'streak';
    philText = philSays('streak');
    showToast('+1 token!');
  } else {
    philMood = 'earned';
    philText = philSays('earned');
    showToast('+1 token!');
  }

  render();
  setTimeout(() => { philMood = 'idle'; philText = philSays('idle'); render(); }, 8000);
}

function spendTokens(cost, label) {
  if (data.tokens < cost) return;
  saveSetting('lastRedeemDate', getToday());
  data.tokens -= cost;
  data.tokensSpent += cost;
  const d = new Date();
  data.promptsUnlocked.push(`${label} (${d.getMonth()+1}/${d.getDate()})`);
  saveData(data);

  philMood = 'idle';
  philText = '去吧。到点了回来。我计时。（不会真的计时。）';
  showToast(`Redeemed: ${label}`);
  render();
}

function showArtUnlock() {
  if (!artUnlockOverlay) return;
  const { index, phil } = artUnlockOverlay;
  const overlay = document.createElement('div');
  overlay.id = 'artUnlockOverlay';
  overlay.className = 'redeem-overlay';
  overlay.innerHTML = `
    <div class="art-unlock-card">
      <div class="art-unlock-badge">#${index + 1} / ${GALLERY.length}</div>
      <div class="art-unlock-img-wrap">
        <img src="${GALLERY[index]}" alt="unlocked art" class="art-unlock-img" />
      </div>
      <div class="art-unlock-title">⭐ NEW ART UNLOCKED</div>
      <div class="art-unlock-phil">"${phil}"<br><span style="font-size:11px;color:var(--ink-faint);font-style:normal">— Phil</span></div>
      <button class="redeem-close" onclick="closeArtUnlock()">NICE →</button>
    </div>
  `;
  document.body.appendChild(overlay);
}

function closeArtUnlock() {
  artUnlockOverlay = null;
  const el = document.getElementById('artUnlockOverlay');
  if (el) el.remove();
}

function resetAll() {
  if (!confirm('Reset all progress? Phil will judge you.')) return;
  data = {
    tokens: 0, totalPomodoros: 0, todayPomodoros: 0,
    todayDate: getToday(), streak: 0, lastStudyDate: null,
    subjectPomodoros: {}, tokensSpent: 0, promptsUnlocked: [],
    subjects: data.subjects, unlockedArt: 0,
  };
  saveData(data);
  philMood = 'idle';
  philText = '…你把存档删了。从零开始。我以前也删过一只蜥蜴的存在。我们没有那么不同。';
  render();
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}


// ── Update Log ──
const UPDATE_VERSION = 'v2.0';

function showUpdateLog() {
  const seen = loadSetting('updateSeen');
  if (seen === UPDATE_VERSION) return;
  
  const overlay = document.createElement('div');
  overlay.id = 'updateOverlay';
  overlay.className = 'update-overlay';
  overlay.innerHTML = `
    <div class="update-card">
      <div class="update-badge">NEW UPDATE</div>
      <div class="update-title">Study Quest v2.0</div>
      <div class="update-phil">"有些更新是为了让你更好地学习。有些是为了让我更好地骂你。这次两个都有。" — Phil</div>
      
      <div class="update-section">
        <div class="update-section-title">🐾 Phil 进化了</div>
        <div class="update-item">Phil 现在会根据你的学习状态主动说话</div>
        <div class="update-item">不学习会有后果。具体什么后果，试试就知道了</div>
        <div class="update-item">坚持学习也会有反馈。Phil 不会承认那是夸你</div>
      </div>

      <div class="update-section">
        <div class="update-section-title">⚙ 新功能</div>
        <div class="update-item">右上角 ⚙ 可以调 timer 时长和 combo 规则</div>
        <div class="update-item">奖励商店支持自定义</div>
      </div>
      
      <button class="update-close" onclick="closeUpdateLog()">知道了，去学 →</button>
    </div>
  `;
  document.body.appendChild(overlay);
}

function closeUpdateLog() {
  saveSetting('updateSeen', UPDATE_VERSION);
  const el = document.getElementById('updateOverlay');
  if (el) el.remove();
}

// ── Init ──
// Request notification permission (may fail on file:// URLs)
try {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
} catch(e) { /* file:// security restriction, ignore */ }

// Init AudioContext on first user interaction (required by browsers)
document.addEventListener('click', ensureAudio, { once: true });
document.addEventListener('touchstart', ensureAudio, { once: true });

render();
startIdleStareDetection();
showUpdateLog();
</script>
</body>
</html>
